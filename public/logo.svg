<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glass Hexagon/Tile -->
  <rect x="6" y="6" width="40" height="40" rx="10" fill="url(#g1)" opacity="0.9" filter="url(#glow)"/>
  <rect x="54" y="6" width="40" height="40" rx="10" fill="url(#g2)" opacity="0.9" />
  <rect x="6" y="54" width="40" height="40" rx="10" fill="url(#g2)" opacity="0.85" />
  <rect x="54" y="54" width="40" height="40" rx="10" fill="url(#g1)" opacity="0.9" filter="url(#glow)" />
  <!-- Glass Sheen Overlay -->
  <path d="M 6 16 C 6 10 10 6 16 6 L 46 6 L 6 46 Z" fill="white" opacity="0.3" />
  <path d="M 54 16 C 54 10 58 6 64 6 L 94 6 L 54 46 Z" fill="white" opacity="0.3" />
  <!-- Center Star Sparkle -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" filter="url(#glow)"/>
</svg>
